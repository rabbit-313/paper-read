name: Daily Paper Recommendations

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate recommendations
        run: python3 tools/daily_recommend.py

      - name: Commit recommendation update
        run: |
          if git diff --quiet -- recommendations; then
            echo "No recommendation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recommendations
          git commit -m "Update daily paper recommendations"
          git push
